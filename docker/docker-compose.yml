version: '3'
services:
  mysql:
    image: mysql:8.0.42
    container_name: mysql
    restart: always
    ports:
      - '3307:3306'
    volumes:
      - /docker/mysql/conf/:/etc/mysql/conf.d/
      - /docker/mysql/data/:/var/lib/mysql/
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: 2270398619
      # 初始化数据库（后续的初始化 SQL 会在这个库执行）
      MYSQL_DATABASE: hr2
      #MYSQL_USER: 你的数据库用户名
      #MYSQL_PASSWORD: 你的数据库密码
    command:
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
#  postgresql:
#    image: postgres:14.2
#    container_name: postgresql
#    restart: always
#    ports:
#      - '5432:5432'
#    volumes:
#      - /docker/postgresql/data/:/var/lib/postgresql/data/
#    environment:
#      TZ: Asia/Shanghai
#      POSTGRES_USER: 你的用户名
#      POSTGRES_PASSWORD: 你的用户密码
#      POSTGRES_DB: continew_admin
  redis:
    image: redis:7.2.8
    container_name: redis
    restart: always
    ports:
      - '6379:6379'
    environment:
      TZ: Asia/Shanghai
  continew-server:
    build:
      context: ..
      dockerfile: docker/continew-admin/Dockerfile
    image: continew-server:4.2.0-SNAPSHOT
    container_name: continew-server
    restart: always
    ports:
      - '18000:18000'
      - '17889:17889'
    volumes:
      - /docker/continew-admin/config/:/app/config/
      - /docker/continew-admin/data/file/:/app/data/file/
      - /docker/continew-admin/logs/:/app/logs/
      - /docker/continew-admin/lib/:/app/lib/
    environment:
      TZ: Asia/Shanghai
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PWD: 2270398619
      DB_NAME: hr2
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PWD: ""
      REDIS_DB: 2
      SCHEDULE_HOST: 172.17.0.1
      SCHEDULE_PORT: 1788
      SCHEDULE_TOKEN: SJ_Wyz3dmsdbDOkDujOTSSoBjGQP1BMsVnj
    depends_on:
      - redis
      - mysql
  continew-customer:
    build:
      context: ..
      dockerfile: docker/continew-customer/Dockerfile
    image: continew-customer:4.2.0-SNAPSHOT
    container_name: continew-customer
    restart: always
    ports:
      - '18002:18002'
    volumes:
      - /docker/continew-customer/config/:/app/config/
      - /docker/continew-customer/data/file/:/app/data/file/
      - /docker/continew-customer/logs/:/app/logs/
    environment:
      TZ: Asia/Shanghai
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PWD: 2270398619
      DB_NAME: hr2
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PWD: ""
      REDIS_DB: 2
      SCHEDULE_HOST: 172.17.0.1
      SCHEDULE_PORT: 1788
      SCHEDULE_TOKEN: SJ_Wyz3dmsdbDOkDujOTSSoBjGQP1BMsVnj
    depends_on:
      - redis
      - mysql
#  continew-web:
#    image: nginx:1.27.0
#    container_name: continew-web
#    restart: always
#    ports:
#      - '80:80'
#      - '443:443'
#    volumes:
#      - /docker/nginx/conf/nginx.conf:/etc/nginx/nginx.conf
#      - /docker/nginx/cert/:/etc/nginx/cert/
#      - /docker/nginx/logs/:/var/log/nginx/
#      # 前端页面目录
#      - /docker/continew-admin/web/:/usr/share/nginx/html/
#    environment:
#      TZ: Asia/Shanghai
  schedule-server:
    build:
      context: ..
      dockerfile: docker/schedule-server/Dockerfile
    image: schedule-server:1.8.0
    container_name: schedule-server
    restart: always
    ports:
      - '18001:18001'
      - '17888:17888'
    volumes:
      - /docker/schedule-server/logs/:/app/logs/
    environment:
      TZ: Asia/Shanghai
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PWD: 2270398619
      DB_NAME: continew_admin_job
    depends_on:
      - mysql
